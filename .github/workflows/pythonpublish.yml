# Release pipeline. File name is kept as `pythonpublish.yml` because PyPI
# Trusted Publishing is bound to it.
#
# Two entry points:
#   * workflow_dispatch - bump version with `uv version`, commit, tag and push
#     from the selected branch, then build and publish. Preferred.
#   * push of a `v*` tag - for manually created tags. The tag must match the
#     version in pyproject.toml and speedcopy/version.py.
#
# Distributions go to TestPyPI first, then PyPI (with PEP 740 attestations),
# and are attached to a GitHub Release with generated notes.
name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump (none = only change pre-release stage)
        type: choice
        options: [ patch, minor, major, none ]
        default: patch
      stage:
        description: Pre-release stage (stable = drop pre-release suffix)
        type: choice
        options: [ final, alpha, beta, rc, stable ]
        default: final
  push:
    tags: [ "v*" ]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: CI
    # Tags pushed by the dispatch path carry this trailer; skip a second run
    # if the push was made with a token that re-triggers workflows.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, 'Release-Automation: workflow_dispatch')
    uses: $/.github/workflows/code_quality.yml
    permissions:
      contents: read

  prepare:
    name: Prepare release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push release commit and tag (dispatch only)
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Require branch for manual release
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'branch'
        run: |
          echo "::error::Run the release workflow from a branch, not a tag."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Credentials are needed only to push the release commit and tag.
          persist-credentials: ${{ github.event_name == 'workflow_dispatch' }}  # zizmor: ignore[artipacked]

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          STAGE: ${{ inputs.stage }}
        run: |
          args=()
          [[ "$BUMP" != none ]] && args+=(--bump "$BUMP")
          [[ "$STAGE" != final ]] && args+=(--bump "$STAGE")
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "::error::Nothing to bump (bump=none, stage=final)."
            exit 1
          fi
          uv version "${args[@]}" --no-sync
          python3 .github/scripts/version_sync.py sync

      - name: Collect version info
        id: info
        run: python3 .github/scripts/version_sync.py info

      - name: Verify version consistency
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: python3 .github/scripts/version_sync.py check ${TAG:+--tag "$TAG"}

      - name: Commit, tag and push
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.info.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists on origin."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock speedcopy/version.py
          git commit -m "🔖 Release $TAG" -m "Release-Automation: workflow_dispatch"
          git tag -a "$TAG" -m "Release $TAG"
          # Atomic: either both branch and tag land, or neither does.
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/$TAG"

      - name: Record release commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build distributions
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: $/.github/actions/build-dist
        with:
          artifact-name: dist
          retention-days: "30"

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/speedcopy/${{ needs.prepare.outputs.version }}/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # Allows re-running a release whose PyPI step failed.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [ prepare, publish-testpypi ]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/speedcopy/${{ needs.prepare.outputs.version }}/
    permissions:
      id-token: write  # Trusted Publishing + attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub Release
    needs: [ prepare, publish-pypi ]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create release and upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=(--verify-tag --generate-notes --title "$TAG")
            [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
