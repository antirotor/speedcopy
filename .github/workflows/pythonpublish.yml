name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Build
        run: uv build
      # Check that basic features work and we didn't miss to include crucial files
      - name: Run tests (wheel)
        run: uv run --isolated --no-project --with dist/*.whl pytest ./tests
      - name: Run tests (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz pytest ./tests
      - name: Publish
        run: uv publish

