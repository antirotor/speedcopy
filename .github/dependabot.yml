version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # Let new releases age before adopting them (supply-chain safety).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: [ "*" ]
    labels: [ dependencies ]

  - package-ecosystem: github-actions
    # Also covers the composite action in .github/actions/.
    directories: [ "/", "/.github/actions/*" ]
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # Let new releases age before adopting them (supply-chain safety).
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: [ "*" ]
    labels: [ ci ]
