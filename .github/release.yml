# Categories for automatically generated release notes.
# https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels: [ ignore-for-release ]
    authors: [ github-actions ]
  categories:
    - title: 🚀 Features
      labels: [ enhancement, feature ]
    - title: 🐛 Bug Fixes
      labels: [ bug, bugfix ]
    - title: 📦 Dependencies
      labels: [ dependencies ]
    - title: 🔧 CI & Tooling
      labels: [ ci, github_actions ]
    - title: Other Changes
      labels: [ "*" ]
